<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>直式加法練習（含進位 • iPad 雙欄版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+HK:wght@500;700;900&display=swap');

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: 'Fredoka', 'Noto Sans HK', sans-serif;
  background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-height: 100dvh;
}
.digit-font { font-family: 'Fredoka', sans-serif; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
.shake { animation: shake 0.4s ease-in-out; }
.input-box { transition: all 0.2s ease; }
.input-box.active {
  border-color: #0284c7;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.3);
  transform: scale(1.03);
}
.digit-clickable {
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
  border-radius: 0.75rem;
}
.digit-clickable:hover, .digit-clickable:active {
  background-color: #fef08a;
  transform: scale(1.1);
}
@keyframes pulse-tap {
  0% { transform: scale(1); }
  50% { transform: scale(0.94); }
  100% { transform: scale(1); }
}
.tap-animate { animation: pulse-tap 0.18s ease-in-out; }
.carry-box {
  opacity: 0.35;
  border-style: dashed;
  transition: all 0.2s ease;
}
.carry-box.has-value,
.carry-box.active {
  opacity: 1;
  border-style: solid;
}
.carry-text { color: #dc2626; font-weight: 900; }
.main-grid {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}
.left-panel, .right-panel {
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.hand-disabled {
  pointer-events: none;
  opacity: 0.7;
}
</style>
</head>
<body class="p-2 sm:p-3">

<header class="w-full max-w-6xl mx-auto flex justify-between items-center mb-1.5 flex-shrink-0">
  <div class="flex items-center space-x-2 sm:space-x-3">
    <span class="text-2xl sm:text-3xl">✏️</span>
    <div>
      <h1 class="text-lg sm:text-xl font-black text-sky-900 tracking-wide leading-tight">直式加法練習</h1>
      <p class="text-[10px] sm:text-xs text-sky-700 font-bold hidden sm:block">點擊直式數字或進位格開啟手勢順數</p>
    </div>
  </div>
  <div class="bg-white/95 backdrop-blur border-2 border-amber-300 px-3 py-1 rounded-full shadow-md flex items-center space-x-1.5">
    <span class="text-amber-500 text-lg">⭐</span>
    <span class="text-sky-900 font-extrabold text-sm sm:text-base" id="score-count">答對: 0</span>
  </div>
</header>

<main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-2 sm:gap-4 main-grid items-stretch">

  <!-- LEFT -->
  <section class="md:col-span-6 bg-white rounded-2xl sm:rounded-3xl shadow-xl border-4 border-sky-200 p-3 sm:p-4 left-panel relative">
    <div class="w-full bg-amber-100/90 border border-amber-300 rounded-xl py-1 px-2 text-center text-[10px] sm:text-xs font-bold text-amber-900 mb-1.5 flex items-center justify-center space-x-1 shadow-sm flex-shrink-0">
      <span class="animate-bounce">👆</span>
      <span>點擊直式數字或紅色進位格可叫出右側手勢順數</span>
    </div>

    <div class="w-full max-w-[280px] mx-auto grid grid-cols-4 gap-1 text-center text-slate-400 font-extrabold text-xs sm:text-sm mb-0.5 flex-shrink-0">
      <div></div>
      <div class="bg-sky-100/80 text-sky-800 py-0.5 rounded-lg">百位</div>
      <div class="bg-sky-100/80 text-sky-800 py-0.5 rounded-lg">十位</div>
      <div class="bg-sky-100/80 text-sky-800 py-0.5 rounded-lg">個位</div>
    </div>

    <div class="w-full max-w-[280px] mx-auto bg-sky-50/70 rounded-2xl p-2.5 sm:p-3 border-2 border-sky-100 mb-2 shadow-inner flex-shrink-0">
      <div class="grid grid-cols-4 gap-1 text-3xl sm:text-4xl font-bold text-gray-800 text-center tracking-wider items-center">
        <div></div>
        <div id="hund-1" class="digit-font text-sky-900 py-0.5"></div>
        <div id="tens-1" onclick="handleDigitClick('tens', 1)" class="digit-font digit-clickable text-sky-900 py-0.5">1</div>
        <div id="units-1" onclick="handleDigitClick('units', 1)" class="digit-font digit-clickable text-sky-900 py-0.5">3</div>

        <div class="text-sky-500 font-black text-2xl sm:text-3xl text-right font-mono">+</div>
        <div id="hund-2" class="digit-font text-sky-900 py-0.5"></div>
        <div id="tens-2" onclick="handleDigitClick('tens', 2)" class="digit-font digit-clickable text-sky-900 py-0.5">2</div>
        <div id="units-2" onclick="handleDigitClick('units', 2)" class="digit-font digit-clickable text-sky-900 py-0.5">2</div>
      </div>

      <!-- 進位格（數線上方） -->
      <div class="grid grid-cols-4 gap-1 items-center mt-2 mb-0.5">
        <div class="text-[9px] sm:text-[10px] font-bold text-rose-400 text-right pr-0.5 leading-tight">進位</div>
        <div id="box-carry-h" onclick="handleCarryClick('hund')" class="carry-box input-box bg-rose-50/80 border-2 border-rose-300 rounded-lg h-8 sm:h-9 flex items-center justify-center text-base sm:text-lg font-black cursor-pointer select-none">
          <span id="text-carry-h" class="carry-text"></span>
        </div>
        <div id="box-carry-t" onclick="handleCarryClick('tens')" class="carry-box input-box bg-rose-50/80 border-2 border-rose-300 rounded-lg h-8 sm:h-9 flex items-center justify-center text-base sm:text-lg font-black cursor-pointer select-none">
          <span id="text-carry-t" class="carry-text"></span>
        </div>
        <div></div>
      </div>

      <div class="w-full h-1 bg-gray-800 rounded-full my-2"></div>

      <div class="grid grid-cols-4 gap-1 items-center">
        <div></div>
        <div id="box-hund" onclick="selectBox('hund')" class="input-box bg-white border-4 border-gray-300 rounded-xl h-12 sm:h-14 flex items-center justify-center text-2xl sm:text-3xl font-black text-sky-700 cursor-pointer select-none shadow-inner">
          <span id="text-hund"></span>
        </div>
        <div id="box-tens" onclick="selectBox('tens')" class="input-box bg-white border-4 border-gray-300 rounded-xl h-12 sm:h-14 flex items-center justify-center text-2xl sm:text-3xl font-black text-sky-700 cursor-pointer select-none shadow-inner">
          <span id="text-tens"></span>
        </div>
        <div id="box-units" onclick="selectBox('units')" class="input-box active bg-white border-4 border-sky-400 rounded-xl h-12 sm:h-14 flex items-center justify-center text-2xl sm:text-3xl font-black text-sky-700 cursor-pointer select-none shadow-inner">
          <span id="text-units"></span>
        </div>
      </div>
    </div>

    <!-- Numpad -->
    <div class="w-full bg-slate-50 rounded-2xl p-2 border-2 border-slate-200 mb-2 flex-shrink-0">
      <div class="text-[10px] font-bold text-slate-400 text-center mb-1">點擊數字盤輸入答案 / 進位</div>
      <div class="grid grid-cols-5 gap-1.5">
        <button onclick="pressDigit(1)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">1</button>
        <button onclick="pressDigit(2)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">2</button>
        <button onclick="pressDigit(3)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">3</button>
        <button onclick="pressDigit(4)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">4</button>
        <button onclick="pressDigit(5)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">5</button>
        <button onclick="pressDigit(6)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">6</button>
        <button onclick="pressDigit(7)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">7</button>
        <button onclick="pressDigit(8)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">8</button>
        <button onclick="pressDigit(9)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">9</button>
        <button onclick="pressDigit(0)" class="h-9 sm:h-10 bg-white hover:bg-sky-100 active:bg-sky-200 text-sky-900 text-xl font-bold rounded-xl shadow-md border-b-4 border-slate-200 active:border-b-0 active:translate-y-0.5 transition">0</button>
      </div>
      <div class="mt-1.5 flex justify-end">
        <button onclick="pressBackspace()" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 active:bg-rose-300 text-rose-700 text-xs font-bold rounded-xl border border-rose-200 flex items-center space-x-1 shadow-sm transition">
          <i class="fa-solid fa-backspace"></i><span>清除</span>
        </button>
      </div>
    </div>

    <div class="w-full flex-shrink-0 mt-auto">
      <button onclick="checkAnswer()" class="w-full px-6 py-2.5 sm:py-3 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold text-lg sm:text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-0.5 transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-check-circle text-xl"></i><span>提交答案</span>
      </button>
    </div>
  </section>

  <!-- RIGHT -->
  <section class="md:col-span-6 bg-white rounded-2xl sm:rounded-3xl shadow-xl border-4 border-amber-200 p-3 sm:p-4 right-panel relative">
    <div class="w-full flex items-center justify-between pb-1.5 border-b-2 border-slate-100 flex-shrink-0">
      <div class="flex items-center space-x-1.5">
        <span class="text-xl">✋</span>
        <h2 class="text-base sm:text-lg font-black text-amber-800">手勢順數小助手</h2>
      </div>
      <span id="gesture-tag" class="text-[10px] sm:text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-0.5 rounded-full border border-amber-300">準備就緒</span>
    </div>

    <div id="gesture-default-view" class="flex-1 flex flex-col items-center justify-center text-center p-4 space-y-3 min-h-0">
      <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center border-4 border-amber-200 text-4xl shadow-sm animate-pulse">💡</div>
      <div class="space-y-0.5">
        <p class="text-sky-900 font-extrabold text-base sm:text-lg">按左邊直式上的數字或進位格</p>
        <p class="text-slate-500 text-xs sm:text-sm font-bold">小助手會顯示手指，幫你繼續順數！</p>
      </div>
    </div>

    <div id="gesture-active-view" class="flex-1 flex flex-col items-center justify-between min-h-0 py-1 hidden">
      <div class="text-center space-y-0.5 mb-1 flex-shrink-0">
        <div id="gesture-step-info" class="text-sm sm:text-base font-extrabold text-sky-900">點擊手指進行順數</div>
        <div id="gesture-count-bubble" class="inline-block bg-amber-50 text-amber-900 font-bold text-xs sm:text-sm px-3 py-0.5 rounded-full border border-amber-200 shadow-sm">按手指順數加法</div>
      </div>
      <div id="hand-svg-container" onclick="handleHandTap()" class="flex-1 flex items-center justify-center cursor-pointer select-none transition-transform active:scale-95 min-h-0" title="按一下手指頭進行順數"></div>
      <div id="gesture-hint-text" class="text-center font-black text-amber-600 text-xs sm:text-sm animate-bounce flex-shrink-0 mt-1">👇 點擊手指頭，繼續順數！</div>
    </div>
  </section>
</main>

<footer class="mt-1 text-center text-[10px] text-sky-700/70 font-bold flex-shrink-0">
  小學一年級數學直式加法練習（含進位 • 一位數混合）
</footer>

<!-- SUCCESS -->
<div id="success-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-emerald-100 flex flex-col items-center">
    <div class="mb-3">
      <svg class="w-16 h-16 sm:w-20 sm:h-20 mx-auto" viewBox="0 0 100 100" fill="none"><path d="M25 75 L45 35 L65 55 Z" fill="#FBBF24" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M25 75 L35 85 L45 75 Z" fill="#F59E0B" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M48 30 Q52 15 65 20" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M55 40 Q70 35 75 48" stroke="#EC4899" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="70" cy="25" r="4" fill="#10B981"/><circle cx="50" cy="18" r="3" fill="#F43F5E"/><circle cx="80" cy="38" r="3.5" fill="#8B5CF6"/><circle cx="42" cy="38" r="2.5" fill="#0284C7"/></svg>
    </div>
    <h2 class="text-xl sm:text-2xl font-black text-[#42C828] mb-5">你好勁啊！數啱咗喇！！</h2>
    <button onclick="nextQuestion()" class="w-full py-3 px-6 bg-[#38C7EC] hover:bg-[#2ab6da] text-white text-lg font-bold rounded-2xl shadow-md border-b-4 border-[#229cb9] active:border-b-0 active:translate-y-0.5 transition-all">下一題</button>
  </div>
</div>

<!-- WRONG -->
<div id="wrong-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-rose-100 flex flex-col items-center">
    <div class="mb-3">
      <svg class="w-16 h-16 sm:w-20 sm:h-20 mx-auto" viewBox="0 0 100 100" fill="none"><path d="M30 65 Q25 45 40 30 Q55 20 65 35 Q75 48 60 62 Q50 72 38 72 Z" fill="#FBBF24" stroke="#000" stroke-width="4" stroke-linejoin="round"/><path d="M40 30 Q48 18 60 22 Q72 28 65 35" fill="#FBBF24" stroke="#000" stroke-width="4" stroke-linejoin="round"/><path d="M45 45 Q55 42 58 52" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>
    </div>
    <h2 class="text-xl sm:text-2xl font-black text-[#FF5252] mb-5">計錯左!!唔緊要，再計過啦!</h2>
    <button onclick="retryCurrentQuestion()" class="w-full py-3 px-6 bg-[#38C7EC] hover:bg-[#2ab6da] text-white text-lg font-bold rounded-2xl shadow-md border-b-4 border-[#229cb9] active:border-b-0 active:translate-y-0.5 transition-all">再試一次</button>
  </div>
</div>

<script>
let currentT1 = 0, currentU1 = 0, currentT2 = 0, currentU2 = 0;
let currentN1 = 0, currentN2 = 0;
let activeBox = 'units';
let inputHund = '', inputTens = '', inputUnits = '';
let inputCarryH = '', inputCarryT = '';
let score = 0;
let columnSum = { units: 0, tens: 0, hund: 0 };

let gestureActive = false;
let gestureTargetCol = '';
let gestureRemainingCount = 0;
let gestureBaseVal = 0;
let gestureCurrentSum = 0;
let gestureIsCarry = false;
let isSpeaking = false;

window.onload = function() {
  generateNewQuestion();
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') pressDigit(parseInt(e.key));
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Enter') checkAnswer();
    else if (e.key === 'ArrowLeft') {
      if (activeBox === 'units') selectBox('tens');
      else if (activeBox === 'tens') selectBox('hund');
    } else if (e.key === 'ArrowRight') {
      if (activeBox === 'hund') selectBox('tens');
      else if (activeBox === 'tens') selectBox('units');
    }
  });
};

function generateNewQuestion() {
  const make1 = () => Math.floor(Math.random() * 9) + 1;
  const make2 = () => Math.floor(Math.random() * 90) + 10;
  currentN1 = (Math.random() < 0.35) ? make1() : make2();
  currentN2 = (Math.random() < 0.35) ? make1() : make2();

  currentT1 = Math.floor(currentN1 / 10);
  currentU1 = currentN1 % 10;
  currentT2 = Math.floor(currentN2 / 10);
  currentU2 = currentN2 % 10;

  document.getElementById('hund-1').innerText = '';
  document.getElementById('tens-1').innerText = currentT1 > 0 ? currentT1 : '';
  document.getElementById('units-1').innerText = currentU1;
  document.getElementById('hund-2').innerText = '';
  document.getElementById('tens-2').innerText = currentT2 > 0 ? currentT2 : '';
  document.getElementById('units-2').innerText = currentU2;

  updateDigitClickability();
  clearInputs();
  resetGesturePanel();
  columnSum = { units: 0, tens: 0, hund: 0 };
  isSpeaking = false;
}

function updateDigitClickability() {
  const t1 = document.getElementById('tens-1');
  const t2 = document.getElementById('tens-2');
  if (currentT1 > 0) {
    t1.classList.add('digit-clickable');
    t1.onclick = () => handleDigitClick('tens', 1);
  } else {
    t1.classList.remove('digit-clickable');
    t1.onclick = null;
  }
  if (currentT2 > 0) {
    t2.classList.add('digit-clickable');
    t2.onclick = () => handleDigitClick('tens', 2);
  } else {
    t2.classList.remove('digit-clickable');
    t2.onclick = null;
  }
}

function clearInputs() {
  inputHund = inputTens = inputUnits = inputCarryH = inputCarryT = '';
  updateInputDisplays();
  updateCarryVisibility();
  selectBox('units');
}

function selectBox(boxName) {
  activeBox = boxName;
  const map = { 'hund':'box-hund','tens':'box-tens','units':'box-units','carry-h':'box-carry-h','carry-t':'box-carry-t' };
  Object.keys(map).forEach(k => {
    const el = document.getElementById(map[k]);
    if (!el) return;
    el.classList.remove('active','border-sky-400');
    el.classList.add(k.startsWith('carry') ? 'border-rose-300' : 'border-gray-300');
  });
  const activeEl = document.getElementById(map[boxName]);
  if (activeEl) {
    activeEl.classList.add('active');
    activeEl.classList.remove(boxName.startsWith('carry') ? 'border-rose-300' : 'border-gray-300');
    activeEl.classList.add('border-sky-400');
  }
}

function pressDigit(num) {
  if (activeBox === 'units') {
    inputUnits = num.toString();
    if (inputTens === '') selectBox('tens');
  } else if (activeBox === 'tens') {
    inputTens = num.toString();
    if (inputHund === '') selectBox('hund');
  } else if (activeBox === 'hund') {
    inputHund = num.toString();
  } else if (activeBox === 'carry-h') {
    inputCarryH = num.toString();
    if (gestureActive && gestureIsCarry && gestureTargetCol === 'hund') {
      refreshCarryGesture('hund', parseInt(inputCarryH, 10) || 0);
    }
  } else if (activeBox === 'carry-t') {
    inputCarryT = num.toString();
    if (gestureActive && gestureIsCarry && gestureTargetCol === 'tens') {
      refreshCarryGesture('tens', parseInt(inputCarryT, 10) || 0);
    }
  }
  updateInputDisplays();
  updateCarryVisibility();
}

function pressBackspace() {
  if (activeBox === 'hund') {
    if (inputHund !== '') inputHund = ''; else selectBox('tens');
  } else if (activeBox === 'tens') {
    if (inputTens !== '') inputTens = ''; else selectBox('units');
  } else if (activeBox === 'units') {
    inputUnits = '';
  } else if (activeBox === 'carry-h') {
    inputCarryH = '';
    if (gestureActive && gestureIsCarry && gestureTargetCol === 'hund') resetGesturePanel();
  } else if (activeBox === 'carry-t') {
    inputCarryT = '';
    if (gestureActive && gestureIsCarry && gestureTargetCol === 'tens') resetGesturePanel();
  }
  updateInputDisplays();
  updateCarryVisibility();
}

function updateInputDisplays() {
  document.getElementById('text-hund').innerText = inputHund;
  document.getElementById('text-tens').innerText = inputTens;
  document.getElementById('text-units').innerText = inputUnits;
  document.getElementById('text-carry-h').innerText = inputCarryH;
  document.getElementById('text-carry-t').innerText = inputCarryT;
}

function updateCarryVisibility() {
  document.getElementById('box-carry-h').classList.toggle('has-value', inputCarryH !== '');
  document.getElementById('box-carry-t').classList.toggle('has-value', inputCarryT !== '');
}

// 計算某位「目前可見數字的總和」（空白視為 0）
function getPresentDigitsSum(col) {
  if (col === 'units') return (currentU1 || 0) + (currentU2 || 0);
  if (col === 'tens')  return (currentT1 || 0) + (currentT2 || 0);
  return 0;
}

// 當進位數字被修改且手指已顯示時，即時更新
function refreshCarryGesture(col, newVal) {
  if (newVal <= 0) {
    resetGesturePanel();
    return;
  }
  const base = getCarryBase(col);
  startHandGesture(col, newVal, base, true);
}

// 進位的起始數字規則：
// 1. 如果該位已經有人用手指數過（columnSum > 0），就用 columnSum
// 2. 否則用該位「目前可見的數字總和」作為起點
//    → 9+59 的十位只有 5 → 按進位 1 會由 5 開始發聲 6
//    → 29+59 的十位 2+5=7 → 按進位 1 會由 7 開始；也可先按 5（由 2 開始 3~7）再按 1（由 7 開始 8）
function getCarryBase(col) {
  if (columnSum[col] > 0) return columnSum[col];
  return getPresentDigitsSum(col);
}

function handleDigitClick(column, row) {
  const el = document.getElementById(`${column}-${row}`);
  if (!el || el.innerText === '') return;

  selectBox(column === 'units' ? 'units' : 'tens');

  let tappedVal = 0, otherVal = 0;
  if (column === 'units') {
    tappedVal = (row === 1) ? currentU1 : currentU2;
    otherVal  = (row === 1) ? currentU2 : currentU1;
  } else {
    tappedVal = (row === 1) ? currentT1 : currentT2;
    otherVal  = (row === 1) ? currentT2 : currentT1;
  }

  // 數字點擊：已有進度就繼續，否則用另一個數字作起點
  const base = (columnSum[column] > 0) ? columnSum[column] : otherVal;
  startHandGesture(column, tappedVal, base, false);
}

function handleCarryClick(col) {
  let carryVal = 0;
  if (col === 'tens') {
    if (inputCarryT === '') { selectBox('carry-t'); return; }
    carryVal = parseInt(inputCarryT, 10);
    selectBox('carry-t');
  } else {
    if (inputCarryH === '') { selectBox('carry-h'); return; }
    carryVal = parseInt(inputCarryH, 10);
    selectBox('carry-h');
  }
  if (carryVal <= 0) return;

  const base = getCarryBase(col);
  startHandGesture(col, carryVal, base, true);
}

function startHandGesture(column, tappedDigit, baseDigit, isCarry) {
  gestureActive = true;
  gestureTargetCol = column;
  gestureRemainingCount = tappedDigit;
  gestureBaseVal = baseDigit;
  gestureCurrentSum = baseDigit;
  gestureIsCarry = isCarry;
  isSpeaking = false;

  document.getElementById('gesture-default-view').classList.add('hidden');
  document.getElementById('gesture-active-view').classList.remove('hidden');

  const colName = column === 'units' ? '個位' : (column === 'tens' ? '十位' : '百位');
  document.getElementById('gesture-tag').innerText = isCarry ? `${colName}進位順數` : `${colName}順數`;
  document.getElementById('hand-svg-container').classList.remove('hand-disabled');

  if (gestureRemainingCount === 0) {
    document.getElementById('gesture-step-info').innerText = `不需要按手指`;
    document.getElementById('gesture-count-bubble').innerText = `請在左邊填寫答案`;
    document.getElementById('hand-svg-container').innerHTML = `<div class="text-center py-4 font-black text-xl text-emerald-600">👌 不需要順數，請在左邊輸入答案！</div>`;
    document.getElementById('gesture-hint-text').innerText = '請在左邊數字盤輸入答案';
    setTimeout(() => resetGesturePanel(), 2200);
    return;
  }
  updateGestureUI(false);
}

function handleHandTap() {
  if (!gestureActive || gestureRemainingCount <= 0 || isSpeaking) return;

  gestureRemainingCount--;
  gestureCurrentSum++;

  playPopSound();
  isSpeaking = true;
  document.getElementById('hand-svg-container').classList.add('hand-disabled');

  speakCantonese(`${gestureCurrentSum}`, function() {
    isSpeaking = false;
    document.getElementById('hand-svg-container').classList.remove('hand-disabled');
  });

  const handContainer = document.getElementById('hand-svg-container');
  handContainer.classList.add('tap-animate');
  setTimeout(() => handContainer.classList.remove('tap-animate'), 180);

  if (gestureRemainingCount === 0) {
    columnSum[gestureTargetCol] = gestureCurrentSum;
    updateGestureUI(true);
    setTimeout(() => resetGesturePanel(), 2500);
  } else {
    updateGestureUI(false);
  }
}

function updateGestureUI(isFinished = false) {
  const stepInfo = document.getElementById('gesture-step-info');
  const countBubble = document.getElementById('gesture-count-bubble');
  const hintText = document.getElementById('gesture-hint-text');
  const container = document.getElementById('hand-svg-container');

  if (isFinished) {
    stepInfo.innerText = `🎉 數完喇！目前合計：${gestureCurrentSum}`;
    countBubble.innerText = `可繼續點其他數字或進位格繼續順數`;
    hintText.innerText = `請點擊左邊數字盤填寫答案，或繼續順數`;
  } else {
    stepInfo.innerText = `點擊手指進行順數`;
    countBubble.innerText = `由 ${gestureBaseVal} 開始繼續加`;
    hintText.innerText = `👇 點擊手指頭，繼續順數！`;
  }
  container.innerHTML = generateHandSVG(gestureRemainingCount);
}

function resetGesturePanel() {
  gestureActive = false;
  isSpeaking = false;
  document.getElementById('gesture-default-view').classList.remove('hidden');
  document.getElementById('gesture-active-view').classList.add('hidden');
  document.getElementById('gesture-tag').innerText = '準備就緒';
  document.getElementById('hand-svg-container').classList.remove('hand-disabled');
}

function generateHandSVG(num) {
  if (num <= 0) {
    return `<div class="text-center py-4 font-black text-xl text-emerald-600 animate-bounce">✅ 順數完成！目前合計：${gestureCurrentSum}</div>`;
  }
  function renderSingleHand(fingers, isRightHand = false) {
    const thumbRaised = (fingers === 5);
    const indexRaised = (fingers >= 1);
    const middleRaised = (fingers >= 2);
    const ringRaised = (fingers >= 3);
    const pinkyRaised = (fingers >= 4);
    const transform = isRightHand ? 'transform="scale(-1, 1) translate(-170, 0)"' : '';
    return `<g ${transform}>
      <path d="M 50 195 L 50 260 C 50 265 120 265 120 260 L 120 195 Z" fill="#FED7AA" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 35 125 C 35 105 50 100 60 100 L 115 100 C 125 100 135 105 135 125 L 130 200 C 130 210 40 210 40 200 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
      ${thumbRaised ? `<path d="M 40 145 C 10 130 5 90 22 75 C 38 65 52 90 55 125 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>` : `<path d="M 40 150 C 25 155 35 175 55 165 Z" fill="#FB923C" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>`}
      ${indexRaised ? `<rect x="46" y="8" width="22" height="108" rx="11" fill="#FDBA74" stroke="#EA580C" stroke-width="4"/>` : `<rect x="46" y="75" width="22" height="40" rx="11" fill="#FB923C" stroke="#EA580C" stroke-width="4"/>`}
      ${middleRaised ? `<rect x="71" y="0" width="22" height="116" rx="11" fill="#FDBA74" stroke="#EA580C" stroke-width="4"/>` : `<rect x="71" y="75" width="22" height="40" rx="11" fill="#FB923C" stroke="#EA580C" stroke-width="4"/>`}
      ${ringRaised ? `<rect x="96" y="8" width="22" height="108" rx="11" fill="#FDBA74" stroke="#EA580C" stroke-width="4"/>` : `<rect x="96" y="75" width="22" height="40" rx="11" fill="#FB923C" stroke="#EA580C" stroke-width="4"/>`}
      ${pinkyRaised ? `<rect x="121" y="28" width="20" height="88" rx="10" fill="#FDBA74" stroke="#EA580C" stroke-width="4"/>` : `<rect x="121" y="75" width="20" height="40" rx="10" fill="#FB923C" stroke="#EA580C" stroke-width="4"/>`}
    </g>`;
  }
  if (num <= 5) {
    return `<svg class="w-40 h-48 sm:w-48 sm:h-56 drop-shadow-md" viewBox="0 0 170 270" fill="none">${renderSingleHand(num, false)}</svg>`;
  } else {
    return `<svg class="w-64 h-48 sm:w-72 sm:h-56 drop-shadow-md" viewBox="0 0 340 270" fill="none">
      <g transform="translate(0, 0)">${renderSingleHand(5, false)}</g>
      <g transform="translate(170, 0)">${renderSingleHand(num - 5, true)}</g>
    </svg>`;
  }
}

function checkAnswer() {
  if (inputUnits === '') {
    document.querySelector('main').classList.add('shake');
    setTimeout(() => document.querySelector('main').classList.remove('shake'), 400);
    return;
  }
  const expectedSum = currentN1 + currentN2;
  const expectedHund = Math.floor(expectedSum / 100);
  const expectedTens = Math.floor((expectedSum % 100) / 10);
  const expectedUnits = expectedSum % 10;

  if (expectedHund === 0) {
    if (inputHund !== '') { showWrong(); return; }
  } else {
    if (inputHund === '' || parseInt(inputHund, 10) !== expectedHund) { showWrong(); return; }
  }
  if (expectedTens === 0 && expectedHund === 0) {
    if (inputTens !== '') { showWrong(); return; }
  } else {
    if (inputTens === '' || parseInt(inputTens, 10) !== expectedTens) { showWrong(); return; }
  }
  if (parseInt(inputUnits, 10) !== expectedUnits) { showWrong(); return; }

  score++;
  document.getElementById('score-count').innerText = `答對: ${score}`;
  playVictorySound();
  speakCantonese("你好勁啊！數啱咗喇！！");
  triggerConfetti();
  document.getElementById('success-modal').classList.remove('hidden');
}

function showWrong() {
  playTryAgainSound();
  speakCantonese("計錯左!!唔緊要，再計過啦!");
  document.getElementById('wrong-modal').classList.remove('hidden');
}

function nextQuestion() {
  document.getElementById('success-modal').classList.add('hidden');
  generateNewQuestion();
}

function retryCurrentQuestion() {
  document.getElementById('wrong-modal').classList.add('hidden');
  clearInputs();
}

function speakCantonese(phrase, onEnd) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(phrase);
    u.lang = 'zh-HK';
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang === 'zh-HK' || v.lang === 'yue-HK' || v.lang.includes('HK') || v.name.includes('Hong Kong') || v.name.includes('Cantonese'));
    if (v) u.voice = v;
    u.pitch = 1.1; u.rate = 0.95;
    if (typeof onEnd === 'function') {
      u.onend = onEnd;
      u.onerror = onEnd;
    }
    window.speechSynthesis.speak(u);
  } else if (typeof onEnd === 'function') {
    onEnd();
  }
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function playPopSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.09);
  } catch(e) {}
}
function playVictorySound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.08);
      gain.gain.setValueAtTime(0.25, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.35);
    });
  } catch(e) {}
}
function playTryAgainSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [392.00, 329.63].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.15);
      gain.gain.setValueAtTime(0.2, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.3);
    });
  } catch(e) {}
}
function triggerConfetti() {
  if (typeof confetti === 'function') confetti({ particleCount: 65, spread: 70, origin: { y: 0.6 } });
}
</script>
